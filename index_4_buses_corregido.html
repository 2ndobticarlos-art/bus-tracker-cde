<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bus Tracker CDE</title>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#1a1a2e"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="BusTracker"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; height: 100vh; display: flex; flex-direction: column; }

    header {
      background: #1a1a2e;
      color: white;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.03em; }
    header span { font-size: 12px; opacity: 0.5; margin-left: auto; }
    .pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: #1D9E75; animation: pulse 2s infinite; flex-shrink: 0; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

    .app { display: flex; flex: 1; overflow: hidden; }

    .sidebar {
      width: 220px;
      flex-shrink: 0;
      background: white;
      border-right: 1px solid #e5e5e5;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 14px 14px 10px;
      border-bottom: 1px solid #e5e5e5;
    }
    .sidebar-header h2 { font-size: 11px; font-weight: 600; color: #999; text-transform: uppercase; letter-spacing: 0.07em; }
    .sidebar-header p { font-size: 12px; color: #bbb; margin-top: 3px; }

    .paradas { flex: 1; padding: 8px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }

    .parada-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      border-radius: 8px;
      border: 1px solid #eee;
      background: white;
      cursor: pointer;
      text-align: left;
      width: 100%;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .parada-btn:hover { background: #f7f9ff; border-color: #c5d8f5; transform: translateX(2px); }
    .parada-btn.active { background: #eef5ff; border-color: #7aaee8; }
    .parada-btn.active .pname { color: #1a4f8a; }

    .dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
    .pname { font-size: 13px; font-weight: 600; color: #222; }
    .pdesc { font-size: 11px; color: #aaa; margin-top: 1px; }

    .sidebar-footer {
      padding: 10px 14px;
      border-top: 1px solid #eee;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      color: #bbb;
    }

    .map-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }

    .map-topbar {
      padding: 10px 16px;
      background: white;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .map-topbar .label { font-size: 14px; font-weight: 600; color: #222; }
    .badge {
      font-size: 11px;
      padding: 2px 9px;
      border-radius: 20px;
      background: #eef5ff;
      color: #185FA5;
      border: 1px solid #b5d4f4;
    }

    #btn-geo, #btn-bus {
      padding: 6px 14px;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    #btn-geo { background: #378ADD; }
    #btn-bus { background: #BA7517; margin-left: 4px; }

    #map { flex: 1; }

    .leyenda {
      position: absolute;
      bottom: 30px;
      left: 10px;
      z-index: 1000;
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      color: #444;
      display: flex;
      flex-direction: column;
      gap: 5px;
      pointer-events: none;
    }
    .leyenda-item { display: flex; align-items: center; gap: 7px; }
    .leyenda-dot { width: 11px; height: 11px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 0 1px #aaa; flex-shrink: 0; }
    .leyenda-line { width: 18px; height: 4px; border-radius: 2px; background: #e67e22; flex-shrink: 0; }

    @media (max-width: 700px) {
      .sidebar { width: 160px; }
      .sidebar-header { padding: 10px; }
      .paradas { padding: 6px; }
      .parada-btn { padding: 9px 8px; gap: 7px; }
      .pname { font-size: 12px; }
      .pdesc { font-size: 10px; }
      header span { display: none; }
      #btn-geo, #btn-bus { padding: 6px 9px; font-size: 11px; }
    }
  </style>
</head>
<body>

<header>
  <div class="pulse-dot"></div>
  <h1>Bus Tracker — Ciudad del Este</h1>
  <span>Proyecto escolar · en desarrollo</span>
</header>

<div class="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>Destinos</h2>
      <p>Elegí tu parada</p>
    </div>

    <div class="paradas" id="paradas">
      <button class="parada-btn active" data-id="0">
        <span class="dot" style="background:#378ADD;"></span>
        <div><div class="pname">Centro</div><div class="pdesc">Ciudad del Este</div></div>
      </button>
      <button class="parada-btn" data-id="1">
        <span class="dot" style="background:#1D9E75;"></span>
        <div><div class="pname">Km 4</div><div class="pdesc">Ruta 7</div></div>
      </button>
      <button class="parada-btn" data-id="2">
        <span class="dot" style="background:#BA7517;"></span>
        <div><div class="pname">Km 7</div><div class="pdesc">Ruta 7</div></div>
      </button>
      <button class="parada-btn" data-id="3">
        <span class="dot" style="background:#D4537E;"></span>
        <div><div class="pname">Área 2</div><div class="pdesc">Ciudad del Este</div></div>
      </button>
    </div>

    <div class="sidebar-footer">
      <div class="pulse-dot"></div>
      Ubicaciones en tiempo real
    </div>
  </div>

  <div class="map-area" style="position:relative;">
    <div class="map-topbar">
      <span>📍</span>
      <span class="label" id="map-label">Centro</span>
      <span class="badge" id="map-badge">Ciudad del Este</span>
      <button id="btn-geo">📍 Compartir mi ubicación</button>
      <button id="btn-bus">🚌 Soy el chofer</button>
    </div>
    <div id="map"></div>

    <div class="leyenda">
      <div class="leyenda-item"><div class="leyenda-dot" style="background:#378ADD;"></div> Mi ubicación</div>
      <div class="leyenda-item"><div class="leyenda-dot" style="background:${busInfo[busId]?.color || '#e67e22'};"></div> Bus en tiempo real</div>
      <div class="leyenda-item"><div class="leyenda-line"></div> Recorrido del bus</div>
    </div>
  </div>
</div>

<script>
  // --- FIREBASE ---
  const firebaseConfig = {
    apiKey: "AIzaSyD9l9h859W_q22xN1nnXp9-ewjtofjoWVc",
    authDomain: "bus-tracker-cde.firebaseapp.com",
    databaseURL: "https://bus-tracker-cde-default-rtdb.firebaseio.com",
    projectId: "bus-tracker-cde",
    storageBucket: "bus-tracker-cde.firebasestorage.app",
    messagingSenderId: "552976557971",
    appId: "1:552976557971:web:b4202b27f7775a3c81ea66"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // --- MAPA ---
  const paradas = [
    { name: "Centro", desc: "Ciudad del Este", lat: -25.510322, lng: -54.616377, zoom: 15, color: "#378ADD" },
    { name: "Km 4", desc: "Ruta 7", lat: -25.507410, lng: -54.635950, zoom: 15, color: "#1D9E75" },
    { name: "Km 7", desc: "Ruta 7", lat: -25.497469, lng: -54.666168, zoom: 15, color: "#BA7517" },
    { name: "Área 2", desc: "Ciudad del Este", lat: -25.529477, lng: -54.610447, zoom: 15, color: "#D4537E" }
  ];

  const map = L.map('map').setView([paradas[0].lat, paradas[0].lng], paradas[0].zoom);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a> contributors',
    maxZoom: 19
  }).addTo(map);

  function makeIcon(color) {
    return L.divIcon({
      className: '',
      html: `<div style="width:14px;height:14px;border-radius:50%;background:${color};border:2px solid white;box-shadow:0 1px 5px rgba(0,0,0,0.4);"></div>`,
      iconSize: [14, 14],
      iconAnchor: [7, 7]
    });
  }

  const paradaMarkers = paradas.map(p =>
    L.marker([p.lat, p.lng], { icon: makeIcon(p.color) })
      .addTo(map)
      .bindPopup(`<b>${p.name}</b><br><span style="color:#888;font-size:12px;">${p.desc}</span>`)
  );
  paradaMarkers[0].openPopup();

  // --- PARADAS SIDEBAR ---
  const btns = document.querySelectorAll('.parada-btn');
  const mapLabel = document.getElementById('map-label');
  const mapBadge = document.getElementById('map-badge');

  btns.forEach(btn => {
    btn.addEventListener('click', () => {
      btns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const p = paradas[+btn.dataset.id];
      map.flyTo([p.lat, p.lng], p.zoom, { duration: 0.9 });
      paradaMarkers[+btn.dataset.id].openPopup();
      mapLabel.textContent = p.name;
      mapBadge.textContent = p.desc;
    });
  });

  // --- MI UBICACIÓN (usuario) ---
  let miMarker = null;
  let miCircle = null;
  let watchId = null;
  const btnGeo = document.getElementById('btn-geo');

  function iconUsuario() {
    return L.divIcon({
      className: '',
      html: `<div style="width:16px;height:16px;border-radius:50%;background:#378ADD;border:3px solid white;box-shadow:0 0 0 4px rgba(55,138,221,0.3);"></div>`,
      iconSize: [16,16],
      iconAnchor: [8,8]
    });
  }

  btnGeo.addEventListener('click', () => {
    if (watchId !== null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
      if (miMarker) { map.removeLayer(miMarker); miMarker = null; }
      if (miCircle) { map.removeLayer(miCircle); miCircle = null; }
      btnGeo.textContent = '📍 Compartir mi ubicación';
      btnGeo.style.background = '#378ADD';
      return;
    }

    if (!navigator.geolocation) {
      alert('Tu navegador no soporta geolocalización.');
      return;
    }

    btnGeo.textContent = '⏳ Obteniendo...';
    btnGeo.style.background = '#888';

    watchId = navigator.geolocation.watchPosition(
      (pos) => {
        const { latitude: lat, longitude: lng, accuracy } = pos.coords;

        if (miMarker) {
          miMarker.setLatLng([lat, lng]);
          miCircle.setLatLng([lat, lng]).setRadius(accuracy);
        } else {
          miMarker = L.marker([lat, lng], { icon: iconUsuario() })
            .addTo(map)
            .bindPopup('<b>Tu ubicación</b>');

          miCircle = L.circle([lat, lng], {
            radius: accuracy,
            color:'#378ADD',
            fillColor:'#378ADD',
            fillOpacity:0.1,
            weight:1
          }).addTo(map);

          map.flyTo([lat, lng], 16, { duration: 1 });
        }

        btnGeo.textContent = '🔵 Activo — tocar para detener';
        btnGeo.style.background = '#1D9E75';
      },
      (err) => {
        alert('Error: ' + err.message);
        btnGeo.textContent = '📍 Compartir mi ubicación';
        btnGeo.style.background = '#378ADD';
        watchId = null;
      },
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
    );
  });

  // --- MODO CHOFER ---
  let busWatchId = null;
  let activeBusId = null;
  const btnBus = document.getElementById('btn-bus');
  const busInfo = {
    bus_01: { name: 'Bus 01', parada: 'Centro', color: '#e67e22' },
    bus_02: { name: 'Bus 02', parada: 'Km 4', color: '#378ADD' },
    bus_03: { name: 'Bus 03', parada: 'Km 7', color: '#1D9E75' },
    bus_04: { name: 'Bus 04', parada: 'Área 2', color: '#D4537E' }
  };

  function iconBus(busId) {
    return L.divIcon({
      className: '',
      html: `<div style="width:18px;height:18px;border-radius:4px;background:${busInfo[busId]?.color || '#e67e22'};border:2px solid white;box-shadow:0 1px 5px rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;font-size:11px;">🚌</div>`,
      iconSize: [18,18],
      iconAnchor: [9,9]
    });
  }

  // =========================================================
  // RECORRIDO DEL BUS
  // =========================================================

  // Línea que se dibuja en el mapa.
  let recorridoLine = null;

  // Puntos que forman el recorrido de la sesión actual.
  let recorridoPuntos = [];

  // Último punto recibido, para evitar guardar puntos prácticamente iguales.
  let ultimoPunto = null;

  // Distancia mínima aproximada entre dos puntos consecutivos.
  // 5 metros evita que el GPS genere cientos de puntos estando detenido.
  const DISTANCIA_MINIMA_METROS = 5;

  function distanciaMetros(lat1, lng1, lat2, lng2) {
    const R = 6371000;
    const rad = Math.PI / 180;

    const dLat = (lat2 - lat1) * rad;
    const dLng = (lng2 - lng1) * rad;

    const a =
      Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(lat1 * rad) *
      Math.cos(lat2 * rad) *
      Math.sin(dLng / 2) *
      Math.sin(dLng / 2);

    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
  }

  function agregarPuntoRecorrido(lat, lng) {
    if (ultimoPunto) {
      const distancia = distanciaMetros(
        ultimoPunto.lat,
        ultimoPunto.lng,
        lat,
        lng
      );

      if (distancia < DISTANCIA_MINIMA_METROS) {
        return;
      }
    }

    const punto = { lat, lng };

    recorridoPuntos.push([lat, lng]);
    ultimoPunto = punto;

    if (!recorridoLine) {
      recorridoLine = L.polyline(recorridoPuntos, {
        color: '#e67e22',
        weight: 5,
        opacity: 0.9,
        lineCap: 'round',
        lineJoin: 'round'
      }).addTo(map);
    } else {
      recorridoLine.setLatLngs(recorridoPuntos);
    }
  }

  function limpiarRecorridoLocal() {
    recorridoPuntos = [];
    ultimoPunto = null;

    if (recorridoLine) {
      map.removeLayer(recorridoLine);
      recorridoLine = null;
    }
  }

  // --- INICIAR / DETENER MODO CHOFER ---
  const busModal = document.createElement('div');
  busModal.style.cssText = 'display:none;position:absolute;inset:0;z-index:2000;background:rgba(0,0,0,.35);align-items:center;justify-content:center;padding:20px;';
  busModal.innerHTML = `
    <div style="width:min(360px,100%);background:white;border-radius:12px;padding:18px;border:1px solid #ddd;">
      <h3 style="font-size:16px;color:#222;margin-bottom:5px;">Seleccioná tu bus</h3>
      <p style="font-size:12px;color:#888;margin-bottom:14px;">Elegí qué bus vas a transmitir desde este dispositivo.</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <button data-bus="bus_01" style="padding:12px;border:1px solid #ddd;border-radius:8px;background:white;cursor:pointer;text-align:left;"><b>🚌 Bus 01</b><br><small>Centro</small></button>
        <button data-bus="bus_02" style="padding:12px;border:1px solid #ddd;border-radius:8px;background:white;cursor:pointer;text-align:left;"><b>🚌 Bus 02</b><br><small>Km 4</small></button>
        <button data-bus="bus_03" style="padding:12px;border:1px solid #ddd;border-radius:8px;background:white;cursor:pointer;text-align:left;"><b>🚌 Bus 03</b><br><small>Km 7</small></button>
        <button data-bus="bus_04" style="padding:12px;border:1px solid #ddd;border-radius:8px;background:white;cursor:pointer;text-align:left;"><b>🚌 Bus 04</b><br><small>Área 2</small></button>
      </div>
      <button id="cancel-bus" style="width:100%;margin-top:10px;padding:8px;border:1px solid #ddd;border-radius:8px;background:#f7f7f7;cursor:pointer;">Cancelar</button>
    </div>`;
  document.querySelector('.map-area').appendChild(busModal);

  btnBus.addEventListener('click', () => {
    if (busWatchId !== null) {
      detenerChofer();
      return;
    }
    busModal.style.display = 'flex';
  });

  busModal.querySelector('#cancel-bus').addEventListener('click', () => {
    busModal.style.display = 'none';
  });

  busModal.querySelectorAll('[data-bus]').forEach(btn => {
    btn.addEventListener('click', () => {
      busModal.style.display = 'none';
      iniciarChofer(btn.dataset.bus);
    });
  });

  function iniciarChofer(busId) {
    if (!navigator.geolocation) {
      alert('Tu navegador no soporta geolocalización.');
      return;
    }

    activeBusId = busId;
    limpiarRecorridoLocal();
    btnBus.textContent = `⏳ Conectando ${busInfo[busId].name}...`;
    btnBus.style.background = '#888';

    busWatchId = navigator.geolocation.watchPosition(
      (pos) => {
        const { latitude: lat, longitude: lng, accuracy } = pos.coords;

        agregarPuntoRecorrido(lat, lng);

        const puntosFirebase = {};
        recorridoPuntos.forEach((punto, index) => {
          puntosFirebase[index] = { lat: punto[0], lng: punto[1] };
        });

        db.ref('buses/' + busId).set({
          lat, lng, accuracy: accuracy || null, timestamp: Date.now(),
          name: busInfo[busId].name, parada: busInfo[busId].parada
        });

        db.ref('recorridos/' + busId).set({
          puntos: puntosFirebase, timestamp: Date.now(),
          name: busInfo[busId].name, parada: busInfo[busId].parada
        });

        btnBus.textContent = `🟠 ${busInfo[busId].name} transmitiendo — tocar para detener`;
        btnBus.style.background = '#c0392b';
      },
      (err) => {
        alert('Error GPS: ' + err.message);
        btnBus.textContent = '🚌 Soy el chofer';
        btnBus.style.background = '#BA7517';
        busWatchId = null;
        activeBusId = null;
        limpiarRecorridoLocal();
      },
      { enableHighAccuracy: true, maximumAge: 3000, timeout: 10000 }
    );
  }

  function detenerChofer() {
    const busId = activeBusId;

    if (busWatchId !== null) {
      navigator.geolocation.clearWatch(busWatchId);
      busWatchId = null;
    }

    if (busId) {
      db.ref('buses/' + busId).remove();
      db.ref('recorridos/' + busId).remove();
    }

    activeBusId = null;
    limpiarRecorridoLocal();
    btnBus.textContent = '🚌 Soy el chofer';
    btnBus.style.background = '#BA7517';
  }

  // --- ESCUCHAR BUSES EN TIEMPO REAL DESDE FIREBASE ---
  const busMarkers = {};

  db.ref('buses').on('value', (snapshot) => {
    const data = snapshot.val();

    // Eliminar markers de buses que ya no están.
    Object.keys(busMarkers).forEach(id => {
      if (!data || !data[id]) {
        map.removeLayer(busMarkers[id]);
        delete busMarkers[id];
      }
    });

    if (!data) return;

    // Agregar o mover markers de buses activos.
    Object.entries(data).forEach(([id, bus]) => {
      if (busMarkers[id]) {
        busMarkers[id].setLatLng([bus.lat, bus.lng]);
      } else {
        busMarkers[id] = L.marker([bus.lat, bus.lng], {
          icon: iconBus()
        })
          .addTo(map)
          .bindPopup(
            `<b>🚌 Bus</b><br>
             <span style="font-size:11px;color:#888;">ID: ${id}</span>`
          );
      }
    });
  });

  // =========================================================
  // ESCUCHAR RECORRIDOS EN TIEMPO REAL DESDE FIREBASE
  // =========================================================

  const recorridoLinesRemotos = {};

  db.ref('recorridos').on('value', (snapshot) => {
    const data = snapshot.val();

    // Eliminar líneas de recorridos que ya no existen.
    Object.keys(recorridoLinesRemotos).forEach(id => {
      if (!data || !data[id]) {
        map.removeLayer(recorridoLinesRemotos[id]);
        delete recorridoLinesRemotos[id];
      }
    });

    if (!data) return;

    Object.entries(data).forEach(([id, recorrido]) => {
      if (!recorrido || !recorrido.puntos) return;

      const puntos = Object.values(recorrido.puntos)
        .filter(p => p && typeof p.lat === 'number' && typeof p.lng === 'number')
        .map(p => [p.lat, p.lng]);

      if (puntos.length === 0) return;

      // Si este es el recorrido que estamos transmitiendo desde este mismo
      // dispositivo, la línea local ya lo está mostrando.
      if (id === activeBusId && busWatchId !== null) {
        return;
      }

      if (recorridoLinesRemotos[id]) {
        recorridoLinesRemotos[id].setLatLngs(puntos);
      } else {
        recorridoLinesRemotos[id] = L.polyline(puntos, {
          color: '#e67e22',
          weight: 5,
          opacity: 0.9,
          lineCap: 'round',
          lineJoin: 'round'
        }).addTo(map);
      }
    });
  });
</script>

<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/bus-tracker-cde/service-worker.js")
      .then(() => console.log("Service Worker registrado ✅"))
      .catch(err => console.log("Error SW:", err));
  }
</script>

</body>
</html>
